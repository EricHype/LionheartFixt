<title>The Horde Playtest Route</title>
<style>
  :root {
    --ground: #e9e7e1;
    --surface: #f7f6f2;
    --sunk: #e1dfd8;
    --ink: #1a1e22;
    --muted: #5e6672;
    --rule: #cfccc3;
    --accent: #2d6b62;
    --accent-soft: #dbe8e5;
    --brass: #8a6a2b;
    --rust: #a03c2c;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14171a;
      --surface: #1c2126;
      --sunk: #191d21;
      --ink: #e6e4de;
      --muted: #8b94a0;
      --rule: #2e353c;
      --accent: #5fb3a6;
      --accent-soft: #1e2e2c;
      --brass: #c9a25a;
      --rust: #d4705e;
    }
  }
  :root[data-theme="dark"] {
    --ground: #14171a;
    --surface: #1c2126;
    --sunk: #191d21;
    --ink: #e6e4de;
    --muted: #8b94a0;
    --rule: #2e353c;
    --accent: #5fb3a6;
    --accent-soft: #1e2e2c;
    --brass: #c9a25a;
    --rust: #d4705e;
  }
  :root[data-theme="light"] {
    --ground: #e9e7e1;
    --surface: #f7f6f2;
    --sunk: #e1dfd8;
    --ink: #1a1e22;
    --muted: #5e6672;
    --rule: #cfccc3;
    --accent: #2d6b62;
    --accent-soft: #dbe8e5;
    --brass: #8a6a2b;
    --rust: #a03c2c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 60rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 6rem;
    display: flex;
    flex-direction: column;
    gap: 2.75rem;
  }

  header { display: flex; flex-direction: column; gap: 0.75rem; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: var(--serif);
    font-size: clamp(2rem, 5vw, 2.9rem);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
    font-weight: 600;
  }
  .standfirst {
    font-size: 1.06rem;
    color: var(--muted);
    max-width: 40rem;
    margin: 0;
  }

  h2 {
    font-family: var(--serif);
    font-size: 1.5rem;
    margin: 0;
    font-weight: 600;
    text-wrap: balance;
  }
  h3 {
    font-family: var(--sans);
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    font-weight: 700;
  }
  p { margin: 0; max-width: 42rem; }
  section { display: flex; flex-direction: column; gap: 1rem; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 1.25rem 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .panel.warn { border-left: 3px solid var(--rust); }
  .panel.note { border-left: 3px solid var(--brass); }

  code, .mono { font-family: var(--mono); font-size: 0.86em; }
  code {
    background: var(--sunk);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 0.05em 0.32em;
    word-break: break-word;
  }

  /* ---- the dependency chain ---- */
  .chain { display: flex; flex-direction: column; gap: 0.5rem; }
  .chain-row {
    display: grid;
    grid-template-columns: 8.5rem 1fr;
    gap: 0.9rem;
    align-items: baseline;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .chain-row:last-child { border-bottom: 0; }
  .chain-key {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .chain-val { font-size: 0.95rem; }

  /* ---- stops ---- */
  .stop { display: flex; flex-direction: column; gap: 1rem; }
  .stop-head {
    display: flex;
    align-items: baseline;
    gap: 0.85rem;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 0.6rem;
  }
  .num {
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--accent);
    font-weight: 700;
  }
  .map {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-left: auto;
  }

  ul.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  ul.checks > li {
    display: grid;
    grid-template-columns: 1.35rem 1fr;
    gap: 0.7rem;
    align-items: start;
    padding-bottom: 0.6rem;
    border-bottom: 1px dotted var(--rule);
  }
  ul.checks > li:last-child { border-bottom: 0; padding-bottom: 0; }
  input[type="checkbox"] {
    margin: 0.35rem 0 0;
    width: 1rem;
    height: 1rem;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .body { display: flex; flex-direction: column; gap: 0.3rem; }
  .who {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 0.1rem 0.42rem;
    border-radius: 2px;
    border: 1px solid var(--rule);
    color: var(--muted);
    background: var(--sunk);
    white-space: nowrap;
  }
  .who.a { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .who.b { color: var(--rust); border-color: var(--rust); background: transparent; }
  .who.both { color: var(--brass); border-color: var(--brass); background: transparent; }
  .expect { font-size: 0.93rem; color: var(--muted); }
  .expect strong { color: var(--ink); font-weight: 600; }
  .flag { color: var(--rust); font-weight: 600; }
  .id {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
  .scroll { overflow-x: auto; }
  th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th {
    font-size: 0.7rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  td.num-col { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  footer {
    border-top: 1px solid var(--rule);
    padding-top: 1.25rem;
    color: var(--muted);
    font-size: 0.88rem;
  }
  a { color: var(--accent); }
  a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
